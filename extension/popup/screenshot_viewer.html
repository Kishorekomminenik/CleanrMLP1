<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Repro</title>
    <link rel="icon" href="../assets/icon32.png" />
    <link rel="stylesheet" href="screenshot_viewer.css" />
  </head>
  <body>
    <div id="editorRoot">
      <div id="toolbar" class="toolbar">
        <div class="toolbar-group tools">
          <button id="toolPointer" class="tool-button active" type="button">
            <span class="btn-icon" aria-hidden="true">&#11044;</span>
            <span class="btn-label">Select</span>
          </button>
          <button id="toolPen" class="tool-button" type="button">
            <span class="btn-icon" aria-hidden="true">&#9998;</span>
            <span class="btn-label">Pen</span>
          </button>
          <button id="toolHighlight" class="tool-button" type="button">
            <span class="btn-icon" aria-hidden="true">&#11036;</span>
            <span class="btn-label">Highlight</span>
          </button>
          <button id="toolCircle" class="tool-button" type="button">
            <span class="btn-icon" aria-hidden="true">&#9711;</span>
            <span class="btn-label">Circle</span>
          </button>
          <button id="toolText" class="tool-button" type="button">
            <span class="btn-icon" aria-hidden="true">&#84;</span>
            <span class="btn-label">Text</span>
          </button>
        </div>

        <div class="toolbar-group styles">
          <div class="control-group" data-controls="pen circle text">
            <label>
              Color
              <input id="mainColor" type="color" value="#ef4444" />
            </label>
          </div>
          <div class="control-group" data-controls="pen">
            <label>
              Pen
              <select id="penWidth">
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
              </select>
            </label>
          </div>
          <div class="control-group" data-controls="circle">
            <label>
              Circle
              <select id="circleWidth">
                <option value="2">2</option>
                <option value="4" selected>4</option>
                <option value="6">6</option>
              </select>
            </label>
          </div>
          <div class="control-group" data-controls="highlight">
            <label>
              Highlight
              <input id="highlightColor" type="color" value="#facc15" />
            </label>
          </div>
          <div class="control-group" data-controls="highlight">
            <label>
              Opacity
              <input
                id="highlightOpacity"
                type="range"
                min="0.1"
                max="0.6"
                step="0.1"
                value="0.3"
              />
            </label>
          </div>
          <div class="control-group" data-controls="text">
            <label>
              Size
              <select id="textSize">
              </select>
            </label>
          </div>
          <div class="control-group" data-controls="text">
            <label>
              Font
              <select id="textFontFamily">
              </select>
            </label>
          </div>
          <div class="control-group" data-controls="text">
            <label>
              Weight
              <select id="textWeight">
              </select>
            </label>
          </div>
          <div class="control-group" data-controls="text">
            <label>
              Color
              <select id="textColor"></select>
            </label>
          </div>
          <div class="control-group" data-controls="text">
            <label>
              Opacity
              <select id="textOpacity"></select>
            </label>
          </div>
        </div>

        <div class="toolbar-group actions">
          <button id="btnUndo" type="button" disabled>
            <span class="btn-icon" aria-hidden="true">&#8630;</span>
            <span class="btn-label">Undo</span>
          </button>
          <button id="btnRedo" type="button" disabled>
            <span class="btn-icon" aria-hidden="true">&#8631;</span>
            <span class="btn-label">Redo</span>
          </button>
          <button id="btnClear" type="button" disabled>
            <span class="btn-icon" aria-hidden="true">&#10006;</span>
            <span class="btn-label">Reset</span>
          </button>
        </div>

        <div class="toolbar-group export">
          <button id="btnCopy" type="button" disabled>
            <span class="btn-icon" aria-hidden="true">&#128203;</span>
            <span class="btn-label">Copy (loading...)</span>
          </button>
          <button id="btnDownload" type="button" class="primary" disabled>
            <span class="btn-icon" aria-hidden="true">&#128190;</span>
            <span class="btn-label">Download</span>
          </button>
        </div>

        <div class="toolbar-group status">
          <span id="statusText">Loading...</span>
        </div>
      </div>
      <div id="editor_boot_error" class="boot-error" hidden></div>

      <div id="stage">
        <div id="canvasWrap">
          <canvas id="baseCanvas"></canvas>
          <canvas id="drawCanvas"></canvas>
          <div id="textLayer"></div>
        </div>
      </div>
    </div>

    <script src="../lib/idb.js"></script>
    <script type="module" src="screenshot_viewer.js"></script>
  </body>
</html>
