<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screenshot Viewer</title>
    <link rel="stylesheet" href="screenshot_viewer.css" />
  </head>
  <body>
    <div class="toolbar">
      <button id="copyBtn" disabled>Copy</button>
      <button id="downloadBtn" class="primary" disabled>Download</button>
      <span id="statusText" class="status">Loading...</span>
    </div>
    <div class="content">
      <img id="shot" alt="Screenshot preview" />
    </div>

    <script src="screenshot_viewer.js"></script>
  </body>
</html>
